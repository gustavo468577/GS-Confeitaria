{% extends 'confeitaria/base.html' %}

{% block titulo %}Login{% endblock %}

{% block conteudo %}

<div class="card">
<h2>Entrar</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Entrar</button>
</form>

<p>
    Ainda não possui uma conta?
    <a href="{% url 'cadastro' %}">Cadastre-se</a>.
</p>

</div>

{% endblock %}
