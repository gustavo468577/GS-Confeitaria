{% extends 'confeitaria/base.html' %}

{% block titulo %}Excluir item de pedido{% endblock %}

{% block conteudo %}
    <h2>Excluir item de pedido</h2>
    <p>Tem certeza que deseja excluir o item de pedido "{{ item_pedido }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusao</button>
        <a href="{% url 'item_pedido_listar' %}">Cancelar</a>
    </form>
{% endblock %}
