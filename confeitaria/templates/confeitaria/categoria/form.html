{% extends 'confeitaria/base.html' %}

{% block titulo %}Formulario de categoria{% endblock %}

{% block conteudo %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <a href="{% url 'categoria_listar' %}">Cancelar</a>
    </form>
{% endblock %}
