{% extends 'confeitaria/base.html' %}

{% block titulo %}Excluir produto{% endblock %}

{% block conteudo %}
    <h2>Excluir produto</h2>
    <p>Tem certeza que deseja excluir o produto "{{ produto }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusao</button>
        <a href="{% url 'produto_listar' %}">Cancelar</a>
    </form>
{% endblock %}
